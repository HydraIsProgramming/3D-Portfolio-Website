<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <rect width="500" height="350" rx="16" fill="#1d1836"/>

  <!-- Road -->
  <rect x="0" y="240" width="500" height="60" fill="#111130"/>
  <rect x="0" y="265" width="500" height="6" fill="#2a2060"/>
  <!-- Road dashes -->
  <rect x="40" y="267" width="40" height="2" fill="#915EFF" opacity="0.5"/>
  <rect x="130" y="267" width="40" height="2" fill="#915EFF" opacity="0.5"/>
  <rect x="220" y="267" width="40" height="2" fill="#915EFF" opacity="0.5"/>
  <rect x="310" y="267" width="40" height="2" fill="#915EFF" opacity="0.5"/>
  <rect x="400" y="267" width="40" height="2" fill="#915EFF" opacity="0.5"/>

  <!-- Car body -->
  <rect x="100" y="185" width="300" height="60" rx="10" fill="#2a2060" stroke="#00cea8" stroke-width="2"/>
  <!-- Car roof -->
  <path d="M170 185 Q190 145 220 140 L290 140 Q320 145 340 185 Z" fill="#2a2060" stroke="#00cea8" stroke-width="2"/>
  <!-- Windshield -->
  <path d="M182 185 Q196 158 220 153 L285 153 Q310 158 322 185 Z" fill="#0d0d2b" opacity="0.9"/>
  <!-- Windows tint -->
  <rect x="176" y="157" width="60" height="28" rx="4" fill="#00cea8" opacity="0.12"/>
  <rect x="244" y="157" width="60" height="28" rx="4" fill="#00cea8" opacity="0.12"/>
  <!-- Headlights -->
  <ellipse cx="118" cy="210" rx="14" ry="8" fill="#00cea8" opacity="0.8"/>
  <ellipse cx="118" cy="210" rx="8" ry="4" fill="#fff" opacity="0.9"/>
  <!-- Tail lights -->
  <ellipse cx="382" cy="210" rx="14" ry="8" fill="#915EFF" opacity="0.8"/>
  <ellipse cx="382" cy="210" rx="8" ry="4" fill="#fff" opacity="0.5"/>
  <!-- Wheels -->
  <circle cx="175" cy="243" r="22" fill="#111130" stroke="#00cea8" stroke-width="3"/>
  <circle cx="175" cy="243" r="10" fill="#2a2060" stroke="#00cea8" stroke-width="2"/>
  <circle cx="325" cy="243" r="22" fill="#111130" stroke="#00cea8" stroke-width="3"/>
  <circle cx="325" cy="243" r="10" fill="#2a2060" stroke="#00cea8" stroke-width="2"/>
  <!-- Door line -->
  <line x1="250" y1="188" x2="250" y2="242" stroke="#00cea8" stroke-width="1.5" opacity="0.5"/>
  <!-- Door handle -->
  <rect x="218" y="212" width="20" height="5" rx="2" fill="#00cea8" opacity="0.7"/>
  <rect x="262" y="212" width="20" height="5" rx="2" fill="#00cea8" opacity="0.7"/>

  <!-- UI Panel (top right) -->
  <rect x="330" y="40" width="140" height="110" rx="10" fill="#2a2060" stroke="#915EFF" stroke-width="1.5"/>
  <text x="400" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#915EFF">RENTAL FORM</text>
  <rect x="345" y="70" width="110" height="12" rx="3" fill="#0d0d2b"/>
  <text x="352" y="80" font-family="monospace" font-size="9" fill="#00cea8">Car: Sedan</text>
  <rect x="345" y="88" width="110" height="12" rx="3" fill="#0d0d2b"/>
  <text x="352" y="98" font-family="monospace" font-size="9" fill="#00cea8">Miles: 120</text>
  <rect x="345" y="106" width="110" height="12" rx="3" fill="#0d0d2b"/>
  <text x="352" y="116" font-family="monospace" font-size="9" fill="#00cea8">Days: 3</text>
  <rect x="355" y="124" width="90" height="18" rx="4" fill="#915EFF" opacity="0.8"/>
  <text x="400" y="136" text-anchor="middle" font-family="monospace" font-size="10" fill="#fff">Calculate</text>

  <!-- Cost output -->
  <rect x="30" y="50" width="130" height="50" rx="8" fill="#2a2060" stroke="#00cea8" stroke-width="1.5"/>
  <text x="95" y="72" text-anchor="middle" font-family="monospace" font-size="10" fill="#aaa">Total Cost</text>
  <text x="95" y="92" text-anchor="middle" font-family="monospace" font-size="18" fill="#00cea8" font-weight="bold">$187.40</text>

  <!-- Java badge -->
  <rect x="210" y="48" width="80" height="26" rx="6" fill="#2a2060" stroke="#915EFF" stroke-width="1.5"/>
  <text x="250" y="65" text-anchor="middle" font-family="monospace" font-size="12" fill="#915EFF">Java</text>

  <!-- Bottom label -->
  <text x="250" y="318" text-anchor="middle" font-family="monospace" font-size="13" fill="#555">Car Rental Interface</text>
</svg>
