<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <rect width="500" height="350" rx="16" fill="#1d1836"/>

  <!-- Chart background -->
  <rect x="30" y="40" width="300" height="180" rx="10" fill="#111130" stroke="#2a2060" stroke-width="1.5"/>

  <!-- Grid lines -->
  <line x1="30" y1="100" x2="330" y2="100" stroke="#2a2060" stroke-width="1"/>
  <line x1="30" y1="140" x2="330" y2="140" stroke="#2a2060" stroke-width="1"/>
  <line x1="30" y1="180" x2="330" y2="180" stroke="#2a2060" stroke-width="1"/>
  <line x1="110" y1="40" x2="110" y2="220" stroke="#2a2060" stroke-width="1"/>
  <line x1="190" y1="40" x2="190" y2="220" stroke="#2a2060" stroke-width="1"/>
  <line x1="270" y1="40" x2="270" y2="220" stroke="#2a2060" stroke-width="1"/>

  <!-- Stock line (actual) -->
  <polyline
    points="50,180 80,160 110,170 140,130 170,145 200,110 230,125 260,90 290,105 320,75"
    stroke="#00cea8" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Prediction line (dashed) -->
  <polyline
    points="320,75 350,60 380,55"
    stroke="#915EFF" stroke-width="2" fill="none" stroke-dasharray="6 4"/>

  <!-- Area fill under line -->
  <polygon
    points="50,180 80,160 110,170 140,130 170,145 200,110 230,125 260,90 290,105 320,75 320,220 50,220"
    fill="#00cea8" opacity="0.06"/>

  <!-- Candles -->
  <rect x="52" y="172" width="8" height="14" rx="1" fill="#00cea8" opacity="0.6"/>
  <rect x="82" y="152" width="8" height="14" rx="1" fill="#00cea8" opacity="0.6"/>
  <rect x="112" y="162" width="8" height="14" rx="1" fill="#915EFF" opacity="0.5"/>
  <rect x="142" y="122" width="8" height="14" rx="1" fill="#00cea8" opacity="0.6"/>
  <rect x="172" y="138" width="8" height="14" rx="1" fill="#915EFF" opacity="0.5"/>
  <rect x="202" y="103" width="8" height="14" rx="1" fill="#00cea8" opacity="0.6"/>
  <rect x="232" y="118" width="8" height="14" rx="1" fill="#915EFF" opacity="0.5"/>
  <rect x="262" y="83" width="8" height="14" rx="1" fill="#00cea8" opacity="0.6"/>
  <rect x="292" y="98" width="8" height="14" rx="1" fill="#00cea8" opacity="0.6"/>

  <!-- Y labels -->
  <text x="22" y="103" text-anchor="end" font-family="monospace" font-size="9" fill="#555">High</text>
  <text x="22" y="183" text-anchor="end" font-family="monospace" font-size="9" fill="#555">Low</text>

  <!-- Chart title -->
  <text x="180" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#aaa">STOCK PRICE</text>
  <text x="360" y="58" font-family="monospace" font-size="9" fill="#915EFF">— Predicted</text>

  <!-- AI Panel (right) -->
  <rect x="345" y="40" width="130" height="180" rx="10" fill="#2a2060" stroke="#915EFF" stroke-width="1.5"/>
  <text x="410" y="62" text-anchor="middle" font-family="monospace" font-size="10" fill="#915EFF">AI MODEL</text>

  <!-- Neural net dots -->
  <circle cx="370" cy="90" r="5" fill="#00cea8" opacity="0.8"/>
  <circle cx="370" cy="110" r="5" fill="#00cea8" opacity="0.8"/>
  <circle cx="370" cy="130" r="5" fill="#00cea8" opacity="0.8"/>
  <circle cx="410" cy="100" r="5" fill="#915EFF" opacity="0.8"/>
  <circle cx="410" cy="120" r="5" fill="#915EFF" opacity="0.8"/>
  <circle cx="450" cy="110" r="5" fill="#00cea8" opacity="0.8"/>
  <!-- Connections -->
  <line x1="375" y1="90" x2="405" y2="100" stroke="#00cea8" stroke-width="1" opacity="0.4"/>
  <line x1="375" y1="90" x2="405" y2="120" stroke="#00cea8" stroke-width="1" opacity="0.4"/>
  <line x1="375" y1="110" x2="405" y2="100" stroke="#00cea8" stroke-width="1" opacity="0.4"/>
  <line x1="375" y1="110" x2="405" y2="120" stroke="#00cea8" stroke-width="1" opacity="0.4"/>
  <line x1="375" y1="130" x2="405" y2="100" stroke="#00cea8" stroke-width="1" opacity="0.4"/>
  <line x1="375" y1="130" x2="405" y2="120" stroke="#00cea8" stroke-width="1" opacity="0.4"/>
  <line x1="415" y1="100" x2="445" y2="110" stroke="#915EFF" stroke-width="1" opacity="0.4"/>
  <line x1="415" y1="120" x2="445" y2="110" stroke="#915EFF" stroke-width="1" opacity="0.4"/>

  <!-- Stats -->
  <rect x="355" y="148" width="110" height="14" rx="3" fill="#0d0d2b"/>
  <text x="362" y="159" font-family="monospace" font-size="9" fill="#00cea8">Capital: $12,450</text>
  <rect x="355" y="167" width="110" height="14" rx="3" fill="#0d0d2b"/>
  <text x="362" y="178" font-family="monospace" font-size="9" fill="#00cea8">Return: +24.5%</text>
  <rect x="355" y="186" width="110" height="14" rx="3" fill="#0d0d2b"/>
  <text x="362" y="197" font-family="monospace" font-size="9" fill="#915EFF">Model: LSTM</text>

  <!-- Tech badges -->
  <rect x="30" y="240" width="70" height="22" rx="5" fill="#2a2060" stroke="#00cea8" stroke-width="1"/>
  <text x="65" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#00cea8">Python</text>
  <rect x="110" y="240" width="90" height="22" rx="5" fill="#2a2060" stroke="#915EFF" stroke-width="1"/>
  <text x="155" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#915EFF">TensorFlow</text>
  <rect x="210" y="240" width="70" height="22" rx="5" fill="#2a2060" stroke="#00cea8" stroke-width="1"/>
  <text x="245" y="255" text-anchor="middle" font-family="monospace" font-size="10" fill="#00cea8">Keras</text>

  <!-- Bottom label -->
  <text x="250" y="318" text-anchor="middle" font-family="monospace" font-size="13" fill="#555">AI Trading Prediction Bot</text>
</svg>
